<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">

</head>

<script type="module">
    import {addItem, showItems, logout} from './firebase.js';
    window.addItem = addItem
    window.showItems = showItems
    window.logout = logout
    showItems()
  </script>
<script type="module" src="script.js"></script>
<style>
        .btn-nav {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .btn-nav:hover {
            background-color: #0056b3;
        }
</style>
<body><center>
    
<center><header>Admin Dashboard</header></center>


<button onclick="logout()">Logout</button>
<a href="home.html" class="btn-nav">View Student Screen</a>



<div id="taskSection">
    <h3>Add Task:</h3>
    <select id="dropdown">
        <option value="" disabled selected hidden>Choose a Category...</option>
        <option value="Laser Cutter">Laser Cutter</option>
        <option value="Ornament Making">Ornament Making</option>
        <option value="General Cleaning">General Cleaning</option>
    </select>
    <input type="text" id="input" placeholder="Enter the Task"><button onclick="addItem(document.getElementById('input').value)">Add Task</button>
</div>

<div id="activeTasks">
    <h3>Currently Active Tasks:</h3>
    <hr>
    <div id="activeTaskDetails">
        <p id="output"></p>
    </div>
</div>

</body>
</html>
